  segmento: geral
  usa: []
  fonte: decisão atual em trilha_briefing/revisao.py::_origem; trilha-briefing/docs/metodo.md, princípio 1 (vozes separadas).
  mensagem: '{n} afirmação(ões) sem fonte (ex.: {onde}): diga se veio da empresa, do consumidor, do mercado, dos dados ou
