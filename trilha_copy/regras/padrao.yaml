regras:
- id: termo_ou_promessa_proibida
  grupo: compliance
  o_que: Nenhum texto público usa termo ou promessa que a marca, o compliance do cliente ou o padrão do segmento proíbem.
  como_detectar: Lista = voz.termos_proibidos ∪ compliance.termos_proibidos ∪ compliance.promessas_proibidas do cliente ∪
    promessa_proibida_<segmento> do playbook (imobiliario, saude), sem repetidos depois de normalizar. O motivo é "termo proibido"
    (voz), "promessa proibida" (compliance) ou "proibido no segmento" (playbook). Procura cada item como termo inteiro em
    cada campo público. Um aviso por campo e termo. Na página, as listas vêm do copy.yaml do cliente, não da cópia gravada
    no pagina.yaml.
  gravidade: bloqueia
  aplica_a:
  - briefing
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa:
  - promessa_proibida_imobiliario
  - promessa_proibida_saude
  fonte: 'decisão atual em trilha_copy/revisao.py::_compliance, trilha_briefing/revisao.py::_copy e trilha_lp/revisao.py::revisar;
    listas do segmento: Trilha/docs/arquitetura/nucleo.md §5.1 (regras_comerciais.promessas_proibidas) e trilha-lp/docs/estrutura.md
    (Regras do imobiliário).'
  mensagem: '{onde}: {motivo} — "{termo}". Não vai ao ar assim: troque o termo. Se a regra mudou, mude a lista no briefing
    e exporte de novo, não aqui.'
  exemplo_ruim: Fluência garantida em 3 meses! (escola cujo briefing proíbe "fluência garantida")
  exemplo_bom: Em 4 meses, a Carla passou a conduzir a reunião semanal em inglês.
- id: garantia_de_resultado
  grupo: compliance
  o_que: 'Não garantir resultado que não depende só da empresa: valorização, aprovação de crédito, renda, cura, fluência,
    vendas.'
  como_detectar: 'Por frase: (a) algum item de garantia_de_resultado; ou (b) "garant*" a até 8 palavras (janela_garantia_palavras),
    na mesma frase, de um item de resultado_garantivel, em qualquer ordem. "Garanta sua vaga" não dispara: vaga não é resultado.
    Exceção: a frase fala de inversão de risco (inversao_de_risco) e a oferta tem inversao_risco ou condição equivalente no
    briefing; garantia contratual ("carreira garantida por contrato") só passa se o texto do contrato estiver no briefing.'
  gravidade: bloqueia
  aplica_a:
  - briefing
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa:
  - garantia_de_resultado
  - resultado_garantivel
  - inversao_de_risco
  fonte: decisão atual em trilha_lp/revisao.py (valorização garantida, só imobiliário), generalizada; trilha-lp/docs/estrutura.md;
    curso-marketing.txt ("100.000 em 7 dias" tomava bloqueio no Facebook e no Google por ser promessa de ganho; "carreira
    garantida por contrato" só porque havia contrato); aulas-copy-1-e-2.txt, Aula 2 ("This course will make you rich, guaranteed"
    como copy inacreditável); assim_nao do cliente-exemplo do briefing ("Fluência garantida em 3 meses!").
  mensagem: '{onde}: garante um resultado que não depende só da empresa ("{trecho}"). É promessa que não dá para cumprir e
    vira publicidade enganosa (CDC). Mostre o que já aconteceu, com prova e fonte, ou garanta o que a empresa controla (prazo,
    devolução, teste).'
  exemplo_ruim: 'Valorização garantida: compre na planta e lucre na entrega.'
  exemplo_bom: Lotes prontos na mesma rua custam hoje de 20% a 30% a mais (tabela das imobiliárias da região, mar/2026).
- id: atributo_pessoal
  grupo: compliance
  o_que: 'Não afirmar nada sobre quem lê: saúde, finanças, idade, religião, orientação, origem.'
  como_detectar: 'Por frase: há item de pronomes_leitor e item de atributo_pessoal na mesma frase ("Você está acima do peso?").
    Frase sem você/seu não dispara ("Para quem quer perder peso" passa).'
  gravidade: bloqueia
  gravidade_por_contexto:
    google_rsa: atencao
    roteiro: atencao
    pagina: atencao
  aplica_a:
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa:
  - pronomes_leitor
  - atributo_pessoal
  fonte: decisão atual em trilha_copy/revisao.py::_compliance (ATRIBUTOS_PESSOAIS, bloqueia no Meta e alerta nos outros);
    política de atributos pessoais do Meta citada em trilha-copywritter/docs/metodo.md §5.
  mensagem: '{onde}: possível afirmação sobre atributo pessoal de quem lê ("{frase}"): o Meta reprova; fale do desejo ou da
    situação, não de quem a pessoa é.'
  exemplo_ruim: Você está endividado e com o nome sujo?
  exemplo_bom: Organize as contas do mês numa planilha que fecha em 15 minutos.
- id: exclusao_de_publico
  grupo: compliance
  o_que: Não restringir nem excluir público por gênero, idade, estado civil ou família no texto.
  como_detectar: 'Por frase: item de exclusao_de_publico. Idade só conta com sujeito de público ("para quem tem até 35 anos"),
    para não pegar prazo ("financie em até 35 anos"). Sobe para bloqueia quando a peça é do Meta e a oferta está em categoria
    especial (habitação, emprego, crédito): compliance.categoria_especial_anuncio do marca.yaml, ou playbook imobiliário com
    categoria marcada.'
  gravidade: atencao
  gravidade_por_contexto:
    meta_categoria_especial: bloqueia
  aplica_a:
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa:
  - exclusao_de_publico
  fonte: 'trilha-copywritter/docs/metodo.md §5 ("Ganchos de identidade e promessa de renda (\"só para mulheres\"…) são pontos
    de reprovação no Meta. Anúncio de oportunidade de trabalho pode cair em categoria especial"); Trilha/playbooks/imobiliario/playbook.yaml
    (categoria_especial_anuncio: verificar); aula-copy-3.txt (o anúncio-exemplo "It''s only for women" é o tipo que reprova
    aqui).'
  mensagem: '{onde}: o texto restringe o público ("{trecho}"). Em habitação, emprego e crédito o Meta reprova e nem deixa
    segmentar assim; nos outros casos, filtre pela situação ou pelo desejo, não por quem a pessoa é.'
  exemplo_ruim: 'Só para casais jovens de até 35 anos: o apartamento ideal para começar a família.'
  exemplo_bom: 'Apartamento de 2 quartos a 600 m da estação Vila Nova: para quem quer ir a pé para o metrô.'
- id: promessa_de_ganho
  grupo: compliance
  o_que: Promessa de ganho com número diz de quem é o resultado e que ele não é o típico.
  como_detectar: 'Por frase: item de promessa_de_ganho e número relevante na mesma frase. Para "ganh*", só conta número em
    R$, % ou com "mil". Não avisa se a peça tem item de ressalva_de_resultado ou um dos compliance.avisos_legais do cliente.
    Se a mesma frase também garante o resultado, quem responde é garantia_de_resultado.'
  gravidade: atencao
  aplica_a:
  - briefing
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa:
  - promessa_de_ganho
  - ressalva_de_resultado
  fonte: decisão atual em trilha_copy/revisao.py::_compliance (PROMESSA_DE_GANHO); curso-marketing.txt (promessa de ganho
    bloqueada no Meta e no Google); trilha-copywritter/docs/metodo.md §5.
  mensagem: '{onde}: promessa de ganho com número ("{frase}"): diga de quem é o resultado e que não é o típico (CDC e políticas
    do Meta). Promessa de renda sem ressalva é motivo comum de reprovação.'
  exemplo_ruim: Fature R$ 10 mil por mês revendendo nossos kits.
  exemplo_bom: A Bruna faturou R$ 4.200 no 3º mês. É o resultado dela; a média da turma foi R$ 1.100.
- id: concorrente_citado
  grupo: compliance
  o_que: 'Citar concorrente pelo nome só com o cliente sabendo: publicidade comparativa tem regras.'
  como_detectar: Cada nome em concorrentes do briefing com 4 letras ou mais, como termo inteiro, em qualquer campo público.
  gravidade: atencao
  aplica_a:
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa: []
  fonte: decisão atual em trilha_copy/revisao.py::_compliance; trilha-copywritter/docs/metodo.md §3 (CONAR).
  mensagem: 'cita o concorrente "{nome}": publicidade comparativa tem regras (CONAR); confirme com o cliente.'
  exemplo_ruim: Mais barato que a Inglês Já e sem taxa de matrícula.
  exemplo_bom: 'Sem taxa de matrícula: você paga só as aulas que faz.'
- id: urgencia_ou_escassez_sem_lastro
  grupo: lastro
  o_que: Prazo ou vagas acabando só aparecem quando são reais, com motivo, e estão registrados no briefing.
  como_detectar: 'Texto (anúncio, roteiro, página): a peça casa com item de urgencia e a oferta da peça (peca.oferta; na página,
    pagina.oferta) não tem urgência válida nem escassez válida. Urgência válida = real e (motivo ou evidência) e (sem data
    ou data ≥ hoje). Escassez válida = real e evidência. Briefing: escassez sem real e evidência, ou urgência sem real e (motivo
    ou evidência), bloqueia mesmo antes de existir peça.'
  gravidade: bloqueia
  aplica_a:
  - briefing
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa:
  - urgencia
  fonte: decisão atual em trilha_copy/revisao.py::_lastro com contrato.py::urgencia_valida/escassez_valida, e trilha_briefing/revisao.py::_copy;
    aulas-copy-1-e-2.txt, Aula 2 ("It must be real. People can smell fake deadlines"; "combine with a reason why"; "don't
    do fake scarcity"); CDC.
  mensagem: '{onde}: fala em "{termo}", mas a oferta não tem urgência ou escassez reais no briefing (marcada como real, com
    motivo ou evidência, dentro do prazo). Prazo ou vaga inventados são publicidade enganosa (CDC) e queimam a confiança:
    registre a urgência no briefing ou tire a frase.'
  exemplo_ruim: Últimas vagas! Corra que acaba hoje. (nada registrado no briefing)
  exemplo_bom: 'Inscrições até 31/10: a turma noturna começa em 3 de novembro e não entra ninguém depois. (urgência real,
    com motivo, no briefing)'
- id: urgencia_vencida
  grupo: lastro
  o_que: Urgência com data passada é atualizada antes de ir para qualquer peça.
  como_detectar: Oferta com urgencia.data anterior a hoje. Nas peças, urgência vencida já não vale como lastro (regra anterior).
  gravidade: atencao
  aplica_a:
  - briefing
  segmento: geral
  usa: []
  fonte: decisão atual em trilha_briefing/revisao.py::_copy.
  mensagem: 'ofertas.{id}.urgencia vencida em {data}: atualize antes de usar em peças. Vencida, ela deixa de liberar palavras
    de prazo nos anúncios e na página.'
  exemplo_ruim: 'urgencia: {texto: Matrícula com desconto até 30/09, data: 2026-09-30} em outubro'
  exemplo_bom: 'urgencia: {texto: Turma de novembro fecha em 31/10, data: 2026-10-31, motivo: turma só abre a cada 2 meses}'
- id: numero_sem_lastro
  grupo: lastro
  o_que: Todo número que afirma algo vem de uma prova, da oferta ou da promessa aprovada no briefing.
  como_detectar: 'Junta os números relevantes do briefing para a oferta da peça (provas, histórias, promessa, diferenciais,
    bastidores, raridade, custo de não agir, como funciona, condições, urgência e data, escassez, antes e depois, promessa
    da célula: revisao.py::_numeros_do_contrato). Todo número relevante de um campo público que não está nesse conjunto entra
    num aviso por peça, com a lista dos números.'
  gravidade: atencao
  aplica_a:
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa: []
  fonte: decisão atual em trilha_copy/revisao.py::_lastro; trilha-copywritter/docs/metodo.md §3 ("Todo número tem lastro");
    curso-marketing.txt ("Para cada promessa, uma prova").
  mensagem: 'número(s) sem lastro no briefing ({numeros}): todo número precisa vir de uma prova, da oferta ou da promessa
    aprovada. Se o número é verdadeiro, registre no briefing com a fonte e exporte de novo.'
  exemplo_ruim: Mais de 5.000 alunos aprovados. (nenhuma prova com esse número)
  exemplo_bom: 'Nota 4,9 com 87 avaliações no Google. (prova com fonte: perfil do Google)'
- id: prova_nao_utilizavel
  grupo: lastro
  o_que: Só entra em anúncio e página a prova com fonte (número, autoridade, mídia, certificação) ou com autorização (depoimento,
    case).
  como_detectar: 'Peça: cada id em peca.provas existe no contrato (o contrato só traz provas utilizáveis). Página: cada depoimento
    e número de prova_social e topo.provas corresponde a uma prova utilizável do briefing (pelo número ou pelo texto; pelo
    id quando a página passar a citar ids). Briefing: prova de número, autoridade, mídia ou certificação sem fonte; depoimento
    ou case sem autorização.'
  gravidade: bloqueia
  gravidade_por_contexto:
    briefing: atencao
  aplica_a:
  - briefing
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa: []
  fonte: decisão atual em trilha_copy/revisao.py::_lastro e trilha_briefing/revisao.py::_provas (esquema.py::Provas.utilizaveis);
    trilha-copywritter/docs/metodo.md §5 (autoridade por associação sem autorização esbarra no CONAR e no direito de imagem).
  mensagem: '{onde}: a prova "{prova}" não é utilizável: {motivo}. Número precisa de fonte; depoimento e case precisam de
    autorização de nome e imagem. Sem isso ela fica fora de anúncios e páginas (CONAR e direito de imagem).'
  exemplo_ruim: '"Melhor escola da cidade!" — Dra. Paula, médica (sem autorização registrada)'
  exemplo_bom: '"Na 4ª aula eu já apresentei o relatório em inglês." — Rafael, analista (autorizado, com data)'
- id: prova_de_outra_persona
  grupo: lastro
  o_que: A prova usada se parece com quem lê.
  como_detectar: 'Peça: prova citada com personas preenchido e sem a persona da peça. Briefing: depoimento ou case utilizável
    sem personas (a copy não sabe para quem ele convence).'
  gravidade: atencao
  gravidade_por_contexto:
    briefing: sugestao
  aplica_a:
  - briefing
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa: []
  fonte: decisão atual em trilha_copy/revisao.py::_lastro e trilha_briefing/revisao.py::_provas; aula-copy-3.txt ("proof is
    relative… match the proof with your avatar").
  mensagem: 'prova "{prova}" ({perfil}) é de outra persona: prova parecida com quem lê convence mais. Troque por uma do perfil
    da persona ou marque no briefing para quem ela convence.'
  exemplo_ruim: Anúncio para dono de oficina com depoimento de uma dentista.
  exemplo_bom: 'Anúncio para dono de oficina com o caso do Paulo, da Auto Center Paulista: agenda cheia em 6 semanas.'
- id: validada_sem_evidencia
  grupo: lastro
  o_que: Afirmação marcada como validada tem evidência registrada.
  como_detectar: Item do briefing (dores, desejos, objeções, ganchos, SWOT, razões para acreditar, diferenciais, histórico)
