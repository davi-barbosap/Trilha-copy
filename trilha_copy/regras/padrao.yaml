  como_detectar: 'Regra do canal = regras_comerciais.preco[canal] da marca (briefing: plataforma.preco), ou preco_padrao_por_segmento
    quando a marca não definiu. Canal: anúncio e roteiro → anuncio; página → landing. Se a regra é "nunca" e algum campo tem
    preco_valor com item de preco_contexto a até 3 palavras, avisa. Valor em prova ("R$ 2 milhões em vendas") não tem contexto
    de preço e não conta.'
  gravidade: bloqueia
  aplica_a:
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa:
  - preco_valor
  - preco_contexto
  fonte: 'trilha_briefing/esquema.py (Plataforma.preco: nunca, a_partir_de, parcela, valor_cheio); Trilha/docs/arquitetura/nucleo.md
    §5.1 (regras_comerciais.preco por canal); Trilha/playbooks/imobiliario/ playbook.yaml (regras_comerciais_padrao); beatriz-moraes082/briefing-trilha/skills/fluxos-imobiliarios/
    references/anatomia_nutricao.md ("Regra do preço — crítica").'
  mensagem: '{onde}: mostra preço ("{trecho}"), mas a regra comercial do cliente para {canal} é não mostrar preço. Preço fora
    da regra atrai quem só compara valor e tira do time a conversa de simulação: tire o valor e chame para a simulação ou
    a visita.'
  exemplo_ruim: 'Apartamento de 2 quartos por R$ 389.000. Compre já! (cliente com anuncio: nunca)'
  exemplo_bom: Apartamento de 2 quartos com entrada parcelada em 60 vezes. Simule com a sua renda.
- id: preco_sem_forma_combinada
  grupo: segmento
  o_que: 'Quando o preço pode aparecer, ele aparece na forma combinada: "a partir de" ou em parcela.'
  como_detectar: 'Mesma regra do canal e mesmo critério de contexto de preço. "a_partir_de": todo preço precisa de item de
