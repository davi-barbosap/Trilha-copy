# Padrão de texto da Trilha: o arquivo canônico.
#
# Vale para todo texto que o público lê: anúncio, roteiro, página e as afirmações do briefing que viram copy.
# O Trilha-copy revisa anúncio, roteiro e página com este arquivo. O Trilha-briefing e a Trilha-LP guardam uma
# cópia dos vocabulários que usam, e a CI deles confere a cópia contra este arquivo: mudou aqui, atualize lá.
#
# Para mudar uma regra, mude aqui: a gravidade (bloqueia, atencao, sugestao ou desligada), a mensagem, os
# vocabulários, os parâmetros. Mensagens usam {campos} preenchidos pela revisão (onde, trecho, termo, n…).
# Divergências entre as ferramentas e o que ficou de fora: docs/padrao-de-texto.md.

versao: 2026-10
gravidades:
  bloqueia: 'Não vai ao ar assim: risco jurídico (CDC, CONAR, conselho profissional), recusa da plataforma, afirmação falsa
    ou sem lastro, ou algo que o cliente proibiu. A revisão sai com erro e a peça não avança nem é aprovada.'
  atencao: 'Vai custar caro ou sair fraco: reprovação provável, texto cortado, promessa que não convence, falta de concretude.
    Não trava, mas o assessor lê e decide.'
  sugestao: 'Melhora a peça: ritmo, palavras do cliente, adjetivo trocado por fato.'
notacao:
  normalizacao: 'NFKD, depois ASCII, depois minúsculas (trilha_copy/texto.py::normalizar). Todo item dos vocabulários já está
    normalizado: sem acento e em minúsculas.'
  termo: Item simples casa como termo inteiro no texto normalizado, com borda de palavra dos dois lados (a mesma de texto.py::contem_termo).
    "so ate" casa com "Só até sexta", mas não com "isso até"; "corra" casa com "Corra!", mas não com "ocorra".
  radical: 'Item terminado em * casa no começo de uma palavra: "revolucionari*" pega revolucionário e revolucionária; "garantid*"
    pega garantido e garantida, mas não garantia.'
  regex: Item começado por "re:" é expressão regular aplicada ao texto normalizado, com borda de palavra no começo e no fim.
principios:
- id: servico_nao_marca
  principio: 'Anúncio é venda multiplicada: fale do que a pessoa ganha, não de quem a empresa é.'
  explicacao: 'O teste é o do vendedor: um bom vendedor diria isso com o cliente na frente dele? Autoelogio, pedido egoísta
    ("exija", "evite imitações") e título que apresenta a empresa afastam quem lê.'
  fonte: 'aulas-copy-1-e-2.txt, Aula 1 (Hopkins: "Advertising is multiplied salesmanship"; "The best ads ask no one to buy";
    "The greatest two faults in advertising lie in boasts and in selfishness"); aula-landing-page.txt (o título não explica
    quem a empresa é); trilha-copywritter/docs/metodo.md §2 e §3.'
  regras:
  - fala_de_si
  - frase_egoista
- id: fato_no_lugar_de_adjetivo
  principio: 'Concretude obrigatória: número, nome próprio ou detalhe no lugar do adjetivo.'
  explicacao: '"Barbear em 78 segundos" e não "barbear rápido"; "a 500 m do Shopping Pátio" e não "perto de tudo". Se você
    só pudesse apontar, para o que apontaria?'
  fonte: 'Trilha/docs/arquitetura/nucleo.md §1, princípio 6 ("Copy sem número, fato ou nome próprio é barrada"); beatriz-moraes082/briefing-trilha/skills/fluxos-imobiliarios/SKILL.md
    ("Apelos comerciais reais do produto — indispensável"); aulas-copy-1-e-2.txt, Aula 1 (Hopkins: 78 segundos, lucro de 3%);
    aula-copy-3.txt (Concrete; teste do surdo-mudo); trilha-briefing/docs/metodo.md, princípio 4.'
  regras:
  - vago_sem_fato
  - peca_sem_concretude
  - promessa_incobravel
- id: tudo_tem_lastro
  principio: 'Tudo o que a peça afirma vem do briefing: número, prova, promessa, urgência.'
  explicacao: Faltou algo, volta ao briefing; não se inventa na peça. Prova só entra com fonte (número) ou autorização (depoimento),
    e convence mais quando se parece com quem lê.
  fonte: trilha_copy/contrato.py ("A copy não inventa nada sobre o cliente"); trilha-copywritter/docs/metodo.md §1; aula-copy-3.txt
    ("Trust is belief with evidence"; "proof is relative"); curso-marketing.txt ("Para cada promessa, uma prova").
  regras:
  - numero_sem_lastro
  - prova_nao_utilizavel
  - prova_de_outra_persona
  - validada_sem_evidencia
  - afirmacao_sem_fonte
- id: promessa_cobravel_e_crivel
  principio: Promessa com resultado observável, prazo e para quem vale, do tamanho em que esse público acredita.
  explicacao: Promessa que dá para cobrar diferencia; promessa grande demais vira "bom demais para ser verdade". Nunca garantir
    o que não depende só da empresa (valorização, aprovação, renda, cura).
  fonte: trilha-briefing/docs/metodo.md, princípio 5; curso-marketing.txt (promessa SMART; "tá bom demais para ser verdade");
    aulas-copy-1-e-2.txt, Aula 2 (confusing, unbelievable, boring; "Do your claims match your audience's current belief?");
    trilha-lp/docs/estrutura.md (nada de valorização garantida).
  regras:
  - promessa_incobravel
  - garantia_de_resultado
  - promessa_de_ganho
- id: prioridade_real
  principio: Urgência e escassez só quando são reais, específicas e com motivo.
  explicacao: Prazo inventado é publicidade enganosa e queima a confiança. Sem urgência real, use o custo de não agir.
  fonte: 'aulas-copy-1-e-2.txt, Aula 2, módulo de urgência e escassez ("It must be real… combine with a reason why… don''t
    do fake scarcity"); aula-copy-3.txt (priority: escassez, urgência e custo de não agir); trilha-copywritter/docs/metodo.md
    §5 ("Urgência falsa não é técnica, é publicidade enganosa").'
  regras:
  - urgencia_ou_escassez_sem_lastro
  - urgencia_vencida
- id: compliance_e_condicao
  principio: O que o cliente, a lei e a plataforma proíbem não vai ao ar; regra de segmento entra por condição.
  explicacao: 'Termos e promessas proibidos, atributos pessoais, registro profissional, regra de preço por canal. A ferramenta
    serve para qualquer segmento: a regra do imobiliário ou da saúde só vale quando o cliente declara o segmento, e mora em
    dados (playbook, briefing), nunca no código.'
  fonte: Trilha/docs/arquitetura/nucleo.md §1, princípios 1 e 10; trilha-lp/README.md ("as regras de um segmento só valem
    quando a página declara esse segmento"); Trilha/playbooks/imobiliario/playbook.yaml (compliance, regras_comerciais_padrao);
    decisão atual em trilha_copy/revisao.py::_compliance.
  regras:
  - termo_ou_promessa_proibida
  - atributo_pessoal
  - exclusao_de_publico
  - preco_proibido_no_canal
  - preco_sem_forma_combinada
  - registro_profissional_ausente
  - antes_e_depois_em_saude
  - concorrente_citado
- id: uma_pessoa_nas_palavras_dela
  principio: Escreva para uma pessoa, com as palavras que ela usa, sobre o desejo e a situação dela.
  explicacao: Frases literais da escuta voltam para o anúncio. Falar da situação ("organize as contas do mês") e nunca afirmar
    quem a pessoa é ("você está endividado?").
  fonte: 'aulas-copy-1-e-2.txt, Aula 1 (Hopkins: "We must treat people in advertising as we treat them in person"); aula-copy-3.txt
    (transcrever as ligações de venda e devolver as frases; Conversational); trilha_copy/revisao.py::_compliance (atributo
    pessoal, Meta).'
  regras:
  - sem_palavras_da_persona
  - atributo_pessoal
  - fala_de_si
- id: uma_ideia_uma_chamada
  principio: Uma ideia por peça, uma chamada, um objetivo por página.
  explicacao: Ideias demais diluem a mensagem; dois objetivos criam dúvida. A chamada diz quem, o quê, até quando e como.
  fonte: curso-marketing.txt ("Uma ideia por COP"; "Só é um único CTA"); aula-copy-3.txt ("one CTA to one avatar to one offer";
    CTA who, what, when, how); trilha-lp/docs/estrutura.md, princípio 2; aulas-copy-1-e-2.txt, Aula 2 ("Have you stuck to
    the one big idea?").
  regras:
  - chamada_sem_quando
  - cta_generico
  - roteiro_sem_chamada
  - meta_sem_botao
- id: claro_conciso_com_ritmo
  principio: 'Claro, curto e com ritmo: frases simples, palavras comuns, tamanhos variados.'
  explicacao: Quem lê está ocupado e distraído. Leitura difícil e frases todas iguais fazem a pessoa desistir no meio.
  fonte: 'aula-copy-3.txt (os 5 Cs: clear, concise, concrete, conversational, cadence; teste do bombeiro); aulas-copy-1-e-2.txt,
    Aula 2 ("Third to fifth grade reading level"); trilha_copy/texto.py.'
  regras:
  - leitura_dificil
  - ritmo_monotono
  - texto_longo_para_a_tela
- id: titulo_escolhe_quem_le
  principio: O título escolhe quem lê e carrega a promessa principal; título de bloco diz o benefício.
  explicacao: 'Muita gente só lê os títulos. Trocar só o título muda muito o retorno do mesmo anúncio: escreva muitos, descarte
    a maioria.'
  fonte: 'aulas-copy-1-e-2.txt, Aula 1 (Hopkins: "The purpose of a headline is to pick out people you could interest"; "Your
    main appeal should lie in your headline"); aula-landing-page.txt ("real people, real results… horrible headline"; ler
    só os títulos); trilha-copywritter/docs/metodo.md §2 (10 rascunhos).'
  regras:
  - titulo_de_bloco_generico
  - titulo_sem_palavra_chave
  - gancho_depois_de_3s
- id: voz_combinada
  principio: 'A voz é a combinada com o cliente: intensidade, termos, exemplos de assim sim e assim não, pessoa gramatical.'
  explicacao: O termostato de 1 (sóbrio) a 5 (euforia de lançamento) limita exclamação, CAIXA ALTA e palavra de euforia. A
    assinatura (marca, pessoa, marca e pessoa) define se o texto diz "nós" ou "eu".
  fonte: aulas-copy-1-e-2.txt, Aula 2 ("If you push on these emotions too hard, your copy might come off as very salesy… unbelievable");
    trilha_briefing/esquema.py (Voz.intensidade); Trilha/docs/arquitetura/nucleo.md §5.1 (assinatura define a pessoa gramatical);
    beatriz-moraes082/briefing-trilha/README.md (como o contexto muda a copy).
  regras:
  - intensidade_acima_da_combinada
  - termo_ou_promessa_proibida
  - fala_de_si
- id: regua_e_a_venda
  principio: 'A régua é a venda, não o clique: a peça provoca a micro-ação sem sabotar a macro.'
  explicacao: Gancho que dá clique de curioso sem perfil derruba o funil. Curiosidade presa à dor ou ao desejo da persona;
    a peça também filtra quem não é cliente.
  fonte: mensagens-internas-trilha.txt ("custo por lead baixo com lead que não fecha é prejuízo disfarçado de eficiência");
    aulas-copy-1-e-2.txt, Aula 2 (micro-ação sem comprometer a macro); trilha-copywritter/docs/metodo.md §2 e §5; trilha-lp/docs/estrutura.md,
    princípio 4.
  regras:
  - promessa_de_ganho
  - peca_sem_concretude
- id: funil_coerente
  principio: Anúncio, página e WhatsApp dizem a mesma coisa, ligados pelo código da célula.
  explicacao: A primeira dobra da página continua a promessa do anúncio que trouxe a pessoa; o código da célula vai no utm_content
    e na mensagem do WhatsApp.
  fonte: Trilha/docs/arquitetura/nucleo.md §1, princípio 7, e §5.4; curso-marketing.txt (a primeira sessão "tem que estar
    conectada com o anúncio que ele viu"); trilha-lp/README.md.
  regras:
  - celula_inexistente
  - peca_diferente_da_celula
- id: objecao_real
  principio: 'Não somos genéricos: cada peça trata uma objeção real, com a resposta que o time usa ao vivo.'
  explicacao: No imobiliário, os três eixos (preço, produto, localização) são obrigatórios na régua. Produto difícil de vender
    no presencial pede contorno de objeção já no criativo.
  fonte: beatriz-moraes082/briefing-trilha/skills/fluxos-imobiliarios/SKILL.md e references/objecoes_e_apelos.md; mensagens-internas-trilha.txt
    ("argumentação de contorno de objeção já no criativo"); curso-marketing.txt ("para cada aumento de consciência, uma quebra
    de objeção"); trilha-lp/docs/estrutura.md §5.
  regras:
  - objecao_sem_resposta
  - diferencial_sem_e_dai
- id: aponta_e_testa
  principio: A revisão aponta, o assessor decide e o teste diz o que funciona.
  explicacao: O que dá para conferir virou regra; o que depende de julgamento virou pergunta ou campo da peça (teste do vendedor,
    dormir sobre a peça). Ângulo positivo ou negativo é variável de teste, não regra; anúncio que funciona não se troca por
    cansaço de quem o vê todo dia.
  fonte: 'trilha-copywritter/docs/metodo.md (abertura, §2 e §5); Trilha/docs/arquitetura/nucleo.md §1, princípio 11; aulas-copy-1-e-2.txt,
    Aula 1 (Hopkins: "We must submit all things in advertising to the court of public opinion"; não trocar o anúncio que funciona).'
  regras:
  - aprovacao_invalidada
parametros:
  numero_relevante: 2 dígitos ou mais, ou com R$, ou com % (texto.py::numeros_relevantes)
  limite_exagero_por_intensidade:
    1: 0
    2: 1
    3: 2
    4: 4
    5: 99
  fala_de_si_minimo_nos: 2
  concorrente_minimo_letras: 4
  legibilidade:
    indice: 'Flesch adaptado ao português (Martins et al., 1996): 248,835 − 1,015 × palavras/frase − 84,6 × sílabas/palavra'
    dificil_abaixo_de: 50
    minimo_palavras: 30
  ritmo:
    coeficiente_de_variacao_minimo: 0.25
    minimo_frases: 4
  meta:
    textos_principais:
      minimo: 1
      maximo: 5
      recomendado_gancho: 125
    titulos:
      minimo: 1
      maximo: 5
      recomendado: 40
    descricoes:
      minimo: 0
      maximo: 5
      recomendado: 30
  google_rsa:
    titulos:
      minimo: 3
      maximo: 15
      rigido: 30
    descricoes:
      minimo: 2
      maximo: 4
      rigido: 90
    caminhos:
      minimo: 0
      maximo: 2
      rigido: 15
    titulos_recomendados: 10
  roteiro:
    palavras_por_segundo: 2.5
    folga_palavras: 2
    gancho_segundos: 3
    folga_duracao_segundos: 1
  pagina:
    topo_titulo_maximo: 90
    descricao_seo_maximo: 155
  estados_sem_minimo:
