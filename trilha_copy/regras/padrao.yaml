  exemplo_ruim: 'diferencial: Turmas pequenas — status: validada, evidencia: '''''
  exemplo_bom: 'diferencial: Turmas de até 6 — status: validada, evidencia: grade de turmas 2026'
- id: afirmacao_sem_fonte
  grupo: lastro
  o_que: 'Toda afirmação do briefing diz quem falou: empresa, consumidor, mercado, dados ou assessor.'
  como_detectar: Itens com fonte nao_informada; um aviso com a contagem e o primeiro exemplo.
  gravidade: sugestao
  aplica_a:
