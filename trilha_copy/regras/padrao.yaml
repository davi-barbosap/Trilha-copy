  mensagem: 'ofertas.{id}.promessa sem {faltas}: promessa que dá para cobrar tem resultado observável (com número), prazo
    e para quem vale. Sem isso ela não diferencia e ainda gera cliente frustrado.'
  exemplo_ruim: Inglês de verdade para a sua carreira.
  exemplo_bom: Em 4 meses, conduzir uma reunião de 30 minutos em inglês, para quem já lê e entende o básico.
- id: objecao_sem_resposta
  grupo: lastro
  o_que: Toda objeção que aparece tem a resposta que o time usa ao vivo.
  como_detectar: 'Briefing: objeção da oferta sem resposta. Página: item de objecoes com resposta vazia, ou resposta que só
    manda falar com a equipe (casa com "entre em contato", "fale com", "estamos a disposicao" e não tem fato).'
  gravidade: atencao
  aplica_a:
  - briefing
  - pagina
  segmento: geral
  usa: []
  fonte: decisão atual em trilha_briefing/revisao.py::_copy; trilha-lp/docs/estrutura.md §5; beatriz-moraes082/ briefing-trilha/skills/fluxos-imobiliarios/SKILL.md
    ("Mensagens tipo 'estamos aqui para tirar suas dúvidas' sozinhas são proibidas"); curso-marketing.txt ("exterminador de
