  exemplo_ruim: 'dor: Não tem tempo para estudar (fonte: nao_informada)'
  exemplo_bom: 'dor: Não tem tempo para estudar (fonte: consumidor, 7 de 12 entrevistas)'
- id: promessa_incobravel
  grupo: lastro
  o_que: A promessa da oferta tem resultado observável com número, prazo e condição (para quem vale).
