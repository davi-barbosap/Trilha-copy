  segmento: geral
  usa: []
  fonte: decisão atual em trilha_briefing/revisao.py::_origem; trilha-briefing/docs/metodo.md, princípio 2 (hipótese até prova).
  mensagem: '{onde}: marcada como validada sem evidência. Diga de onde veio (entrevista, conversa do CRM, relatório): é ela
