    "valor_cheio": sem aviso.'
  gravidade: atencao
  aplica_a:
  - anuncio
  - roteiro
  - pagina
  segmento: geral
  usa:
  - preco_valor
  - preco_contexto
  - forma_a_partir_de
  - forma_parcela
  fonte: 'decisão atual em trilha_lp/revisao.py (imobiliário: preço sem "a partir de"), generalizada; trilha-lp/docs/estrutura.md
    ("Preço só como ''a partir de'', amarrado à visita ou à simulação"); beatriz-moraes082/briefing-trilha/skills/fluxos-imobiliarios/references/objecoes_e_apelos.md
    ("valores a partir de R$ [PRECO_MIN]" amarrado ao convite de visita).'
  mensagem: '{onde}: preço fora da forma combinada para {canal} ({regra}): "{trecho}". Mostre só o valor de entrada ou a parcela,
    amarrado à visita ou à simulação; o valor fechado fica com o time comercial.'
  exemplo_ruim: 'Lotes de 250 m² por R$ 377 mil. (landing: a_partir_de)'
  exemplo_bom: Lotes de 250 a 406 m², a partir de R$ 377 mil. Agende a visita à obra.
